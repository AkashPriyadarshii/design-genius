<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="waxGradLg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d44e33"/>
      <stop offset="60%" stop-color="#ba3c26"/>
      <stop offset="100%" stop-color="#8a2512"/>
    </radialGradient>
    <pattern id="ledgerRules" width="1200" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="31.5" x2="1200" y2="31.5" stroke="#ded8c8" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Base Canvas (Munken Newsprint) -->
  <rect width="1200" height="630" fill="#f7f4ed"/>
  <rect width="1200" height="630" fill="url(#ledgerRules)"/>

  <!-- Outer 1px Frame -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#2b2d35" stroke-width="2"/>
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="#ded8c8" stroke-width="1"/>

  <!-- Top Header Metadata -->
  <text x="80" y="96" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" fill="#ba3c26" letter-spacing="3">UNIVERSAL DESIGN SPECIFICATION ENGINE // FOSS</text>
  <line x1="80" y1="116" x2="1120" y2="116" stroke="#ded8c8" stroke-width="1.5"/>

  <!-- Left Content Block -->
  <text x="80" y="210" font-family="'Courier New', Courier, monospace" font-size="64" font-weight="900" fill="#1b1d22" letter-spacing="-1">design-genius</text>
  <text x="80" y="270" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#ba3c26">It reads the library. It stamps out AI slop.</text>
  
  <text x="80" y="340" font-family="Georgia, serif" font-size="20" fill="#525560" width="580">
    Fuses 2 to 3 structurally distinct design systems from disk.
  </text>
  <text x="80" y="372" font-family="Georgia, serif" font-size="20" fill="#525560">
    Emits bespoke DESIGN.md specs with causal OKLCH pigments.
  </text>

  <!-- Bottom Telemetry Badges -->
  <g transform="translate(80, 470)">
    <rect x="0" y="0" width="170" height="42" fill="#ede7d8" stroke="#2b2d35" stroke-width="1.5" rx="2"/>
    <text x="16" y="26" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#1b1d22" letter-spacing="1">74 DISK SYSTEMS</text>

    <rect x="190" y="0" width="170" height="42" fill="#ede7d8" stroke="#2b2d35" stroke-width="1.5" rx="2"/>
    <text x="206" y="26" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#ba3c26" letter-spacing="1">≥ 40° HUE ARC</text>

    <rect x="380" y="0" width="170" height="42" fill="#ede7d8" stroke="#2b2d35" stroke-width="1.5" rx="2"/>
    <text x="396" y="26" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#1b1d22" letter-spacing="1">10-DIM AUDIT</text>
  </g>

  <!-- Bottom Author Credit -->
  <text x="80" y="550" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6a6d78" letter-spacing="1.5">BY AKASH PRIYADARSHI // PATNA, BIHAR, INDIA</text>

  <!-- Right Side Sealing-Wax Stamp Badge -->
  <g transform="translate(940, 340) rotate(-5)" filter="url(#badgeShadow)">
    <circle cx="0" cy="0" r="140" fill="url(#waxGradLg)"/>
    <circle cx="0" cy="0" r="126" fill="none" stroke="#f7f4ed" stroke-width="2.5" stroke-dasharray="8 5" opacity="0.9"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#f7f4ed" stroke-width="1" opacity="0.6"/>
    
    <text x="0" y="-45" font-family="'Courier New', Courier, monospace" font-size="28" fill="#f7f4ed" text-anchor="middle">★ ★ ★</text>
    <text x="0" y="-10" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="900" fill="#f7f4ed" text-anchor="middle" letter-spacing="3">OFFICIALLY</text>
    <text x="0" y="16" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="900" fill="#f7f4ed" text-anchor="middle" letter-spacing="4">SEALED</text>
    <text x="0" y="44" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700" fill="#f7f4ed" text-anchor="middle" letter-spacing="2">ZERO AI SLOP</text>
    <text x="0" y="68" font-family="'Courier New', Courier, monospace" font-size="10" fill="#f7f4ed" text-anchor="middle" letter-spacing="1.5" opacity="0.8">100% DISK RECEIPTS</text>
  </g>
</svg>
